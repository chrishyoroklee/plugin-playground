<!doctype html>
<!--
  The plugin's window: the device as the page shows it, drawn from the face a device
  file carries (patchc.py, face()). The plugin loads this page in a web view and the two
  talk in these messages:

    page -> plugin   {type: "ready"}                       ask for the face and the values
                     {type: "begin" | "end", index}        a dial was grabbed, or let go
                     {type: "set", index, value}           a dial moved; value in its own units
                     {type: "preset", index}               a preset was picked in the menu
    plugin -> page   ppPresets([{name, values}, ...])      a plugin with presets: before the face
                     ppFace(face, dials)                   at first, and when a preset changes the program;
                                                           dials[i] is the plugin's number for the face's dial i
                                                           (a program's own count differs from the plugin's)
                     ppValues([v0, v1, ...])               whenever the host moved something
                     ppChosen(index)                       the preset last chosen, -1 for none

  The preset menu is a strip above the device (BAR high; gui_mac.mm makes the window
  that much taller). A preset with another program can have another size: the plugin
  asks the host for it, and if the host says no, the face is fitted into the window. It says "edited" once a dial is away from where the preset put it.

  The pictures above the dials are drawn by src/plugin/graphs.js, the same file the page
  and the Max for Live device use. It is pasted into the first script below when the
  plugin is built (CMakeLists.txt).
  The dial is the page's own (src/objects/ui/live-dial.ts), geometry and gestures both,
  so a device looks and handles the same in the browser and in a DAW. Keep them in step.
  __FONTS__ is replaced with the two DM Mono files when the plugin is built.
-->
<html>
<head>
<meta charset="utf-8">
<!-- The face comes from a device file, which anyone can write: this page may fetch nothing. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src data:; img-src data:">
<style>
__FONTS__
html, body { margin: 0; height: 100%; overflow: hidden; background: #feddd4; }
body { font-family: 'DM Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; -webkit-user-select: none; user-select: none; cursor: default; }
#root { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#device { position: absolute; left: 0; top: 0; }
#bar { position: absolute; left: 0; top: 0; right: 0; height: 26px; display: flex; align-items: center; gap: 4px; padding: 0 8px; box-sizing: border-box; background: rgba(127, 127, 127, 0.10); }
#bar[hidden] { display: none; }
#bar button, #bar select { font: inherit; font-size: 9px; letter-spacing: 0.04em; color: inherit; background: rgba(127, 127, 127, 0.16); border: 0; border-radius: 4px; height: 18px; }
#bar button { width: 18px; padding: 0; cursor: pointer; }
#bar select { min-width: 150px; max-width: 260px; padding: 0 4px; cursor: pointer; }
#bar .what { font-size: 8px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.6; margin-right: 4px; }
.panel { position: absolute; box-shadow: 0 0 0 1px rgba(47, 16, 7, 0.07) inset; }
.label { position: absolute; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: 0.08em; font-weight: 500; }
.graph { position: absolute; border-radius: 8px; overflow: hidden; cursor: grab; }
.graph canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.dial { position: absolute; cursor: ns-resize; outline: none; }
.dial svg { display: block; overflow: visible; }
.dial text { font-family: inherit; }
.dial .name { font-size: 7.2px; fill: #2f1007; text-transform: uppercase; letter-spacing: 0.06em; }
.dial .readout { font-size: 6.8px; fill: #8f6f65; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="root">
  <div id="bar" hidden>
    <span class="what">Preset</span>
    <button type="button" id="prev" title="Previous preset">&#8249;</button>
    <select id="pick" title="Presets"></select>
    <button type="button" id="next" title="Next preset">&#8250;</button>
  </div>
  <div id="device"></div>
</div>
<script>
__GRAPHS__
</script>
<script>
(function () {
  'use strict';
  var SVG = 'http://www.w3.org/2000/svg';
  var pictures = [];   // each picture's redraw, for when the host moves a dial
  // The knob's travel: 270 degrees, from 7:30 round to 4:30.
  var A0 = 135, SWEEP = 270, CX = 22, CY = 25, R = 11.6;
  var dials = [];   // by parameter index: {param, value, redraw}

  function send(message) {
    try {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.pp) window.webkit.messageHandlers.pp.postMessage(message);
      else if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage(message);
      else if (window.ppHost) window.ppHost(message);
    } catch (e) { /* no plugin behind the page: it is being looked at on its own */ }
  }

  function polar(deg, r) {
    var a = deg * Math.PI / 180;
    return [CX + (r || R) * Math.cos(a), CY + (r || R) * Math.sin(a)];
  }
  function arc(from, to) {
    var p0 = polar(from), p1 = polar(to);
    if (Math.abs(to - from) < 0.01) return 'M ' + p0[0] + ' ' + p0[1];
    return 'M ' + p0[0] + ' ' + p0[1] + ' A ' + R + ' ' + R + ' 0 ' + (to - from > 180 ? 1 : 0) + ' 1 ' + p1[0] + ' ' + p1[1];
  }
  function clamp01(n) { return Math.min(1, Math.max(0, n)); }
  function valueAt(p, position) {
    var v = p.min + (p.max - p.min) * Math.pow(clamp01(position), p.exponent);
    return p.integer ? Math.round(v) : v;
  }
  function positionOf(p, value) {
    if (p.max === p.min) return 0;
    return Math.pow(clamp01((value - p.min) / (p.max - p.min)), 1 / p.exponent);
  }
  function trim(n, digits) {
    var s = n.toFixed(digits);
    return s.indexOf('.') >= 0 ? s.replace(/\.?0+$/, '') : s;
  }
  // A value as Ableton prints it under the dial. Units: 0 int, 1 float, 2 ms, 3 Hz, 4 dB, 5 %.
  function format(p, value) {
    switch (p.unit) {
      case 0: return String(Math.round(value));
      case 2: return value >= 1000 ? trim(value / 1000, 2) + ' s' : trim(value, value < 10 ? 1 : 0) + ' ms';
      case 3: return value >= 1000 ? trim(value / 1000, 2) + ' kHz' : trim(value, value < 10 ? 2 : 0) + ' Hz';
      case 4: return (value > 0 ? '+' : '') + trim(value, 1) + ' dB';
      case 5: return trim(value, 0) + ' %';
      default: return trim(value, Math.abs(value) >= 100 ? 0 : 2);
    }
  }
  // Colours arrive as "rgba(r, g, b, a)" or "#rrggbb".
  function rgb(colour) {
    var m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(colour);
    if (m) return [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)];
    m = /rgba?\(\s*([\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)/.exec(colour);
    return m ? [Number(m[1]), Number(m[2]), Number(m[3])] : [0, 0, 0];
  }
  // A colour from the face, if it is one: #hex, rgb() or rgba(). Anything else (a url(),
  // say, which would make the window fetch it) is the fallback.
  function colour(v, fallback) {
    return typeof v === 'string' && /^(#[0-9a-fA-F]{3,8}|rgba?\([0-9.,%\s]+\))$/.test(v) ? v : fallback;
  }

  function mix(a, b, t) {
    var x = rgb(a), y = rgb(b);
    return 'rgb(' + [0, 1, 2].map(function (i) { return Math.round(x[i] + (y[i] - x[i]) * t); }).join(', ') + ')';
  }
  function luminance(colour) {
    var c = rgb(colour);
    return (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255;
  }
  function mk(parent, tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  }

  function dial(item) {
    var p = item.param, index = item.index;
    var lo = Math.min(p.min, p.max), hi = Math.max(p.min, p.max);
    var bound = function (v) { var c = Math.min(hi, Math.max(lo, v)); return p.integer ? Math.round(c) : c; };
    var state = { param: p, index: index, value: bound(p.initial), redraw: null, held: false };

    var root = document.createElement('div');
    root.className = 'dial';
    root.dataset.index = index;
    root.tabIndex = 0;
    root.setAttribute('role', 'slider');
    root.setAttribute('aria-label', p.name);
    var svg = document.createElementNS(SVG, 'svg');
    svg.setAttribute('viewBox', '0 0 44 48');
    svg.setAttribute('width', '100%');
    svg.setAttribute('height', '100%');
    root.appendChild(svg);

    // The dial in the device's colours. Its disc and its readout are worked out from the
    // two the patch gives, the same way the page does (device-view.ts, dialColours).
    var ink = item.ink || '#2f1007', track = item.track || '#e6bdb3';
    var dark = luminance(ink) > 0.5;
    var cap = dark ? mix(track, '#000000', 0.25) : mix(track, '#ffffff', 0.85);
    var name = mk(svg, 'text', { x: 22, y: 8, 'text-anchor': 'middle', 'class': 'name' });
    name.textContent = p.short;
    name.style.fill = ink;
    mk(svg, 'path', { d: arc(A0, A0 + SWEEP), fill: 'none', stroke: track, 'stroke-width': 1.2, 'stroke-linecap': 'round' });
    var fill = mk(svg, 'path', { d: '', fill: 'none', stroke: colour(item.accent, '#3f78bd'), 'stroke-width': 1.7, 'stroke-linecap': 'round' });
    mk(svg, 'circle', { cx: CX, cy: CY, r: 9.6, fill: cap, stroke: track, 'stroke-width': 0.5 });
    var needle = mk(svg, 'line', { x1: CX, y1: CY, x2: CX, y2: CY, stroke: ink, 'stroke-width': 1.2, 'stroke-linecap': 'round' });
    var readout = mk(svg, 'text', { x: 22, y: 46, 'text-anchor': 'middle', 'class': 'readout' });
    readout.style.fill = mix(ink, track, 0.5);

    state.redraw = function () {
      var deg = A0 + SWEEP * positionOf(p, state.value);
      fill.setAttribute('d', arc(A0, deg));
      var a = polar(deg, 2.6), b = polar(deg, 8.6);
      needle.setAttribute('x1', a[0]); needle.setAttribute('y1', a[1]);
      needle.setAttribute('x2', b[0]); needle.setAttribute('y2', b[1]);
      readout.textContent = format(p, state.value);
    };
    state.redraw();

    var set = function (v) {
      var next = bound(v);
      if (next === state.value) return;
      state.value = next;
      state.redraw();
      latest[index] = next;
      showChosen();
      send({ type: 'set', index: index, value: next });
    };
    // One gesture for the host to record: grabbed, moved any number of times, let go.
    var once = function (change) { send({ type: 'begin', index: index }); change(); send({ type: 'end', index: index }); };

    // Drag up and down, the way every plugin knob works; Shift for fine control.
    var dragging = false, dragY = 0, dragPos = 0;
    root.addEventListener('pointerdown', function (e) {
      if (e.button !== 0) return;
      dragging = state.held = true; dragY = e.clientY; dragPos = positionOf(p, state.value);
      root.setPointerCapture(e.pointerId);
      send({ type: 'begin', index: index });
      e.preventDefault();
    });
    root.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      set(valueAt(p, dragPos + (dragY - e.clientY) / ((e.shiftKey ? 900 : 180) * zoom)));
    });
    var release = function (e) {
      if (!dragging) return;
      dragging = state.held = false;
      if (root.hasPointerCapture(e.pointerId)) root.releasePointerCapture(e.pointerId);
      send({ type: 'end', index: index });
    };
    root.addEventListener('pointerup', release);
    root.addEventListener('pointercancel', release);
    root.addEventListener('dblclick', function () { once(function () { set(p.initial); }); });
    var wheelEnd = 0;
    root.addEventListener('wheel', function (e) {
      e.preventDefault();
      if (!wheelEnd) send({ type: 'begin', index: index });
      clearTimeout(wheelEnd);
      wheelEnd = setTimeout(function () { wheelEnd = 0; send({ type: 'end', index: index }); }, 300);
      set(valueAt(p, positionOf(p, state.value) - e.deltaY * (e.shiftKey ? 0.0002 : 0.001)));
    }, { passive: false });

    state.set = set;
    dials[index] = state;
    return root;
  }

  // A picture of a module, above its dials: graphs.js on a canvas, as on the page
  // (src/plugin/graph-view.ts). It reads its dials' values and, dragged, turns them.
  function graph(item) {
    var root = document.createElement('div');
    root.className = 'graph';
    if (typeof PPGraphs === 'undefined' || !PPGraphs.has(item.kind)) return root;
    var w = item.rect[2], h = item.rect[3], ratio = 4;
    var canvas = document.createElement('canvas');
    canvas.width = Math.round(w * ratio);
    canvas.height = Math.round(h * ratio);
    root.appendChild(canvas);
    var ctx = canvas.getContext('2d');
    var c = item.colours || {};
    var css = function (k) { return 'rgba(' + Math.round(k[0] * 255) + ', ' + Math.round(k[1] * 255) + ', ' + Math.round(k[2] * 255) + ', ' + (k.length > 3 ? k[3] : 1) + ')'; };
    if (c.well) root.style.background = css(c.well);
    var palette = { ink: c.ink || [0.18, 0.06, 0.03], track: c.track || [0.9, 0.74, 0.7], accent: c.accent || [0.25, 0.47, 0.74], card: c.card || [1, 1, 1] };
    var values = {}, ranges = {}, tied = {}, hot = null, key;
    for (key in item.options) values[key] = item.options[key];
    item.dials.forEach(function (d) {
      var state = dials[d.index];
      if (!state) return;
      tied[d.id] = state;
      ranges[d.id] = { min: state.param.min, max: state.param.max, exponent: state.param.exponent };
    });
    var g = {
      path: function (pts, stroke, width, fill) {
        if (pts.length < 4) return;
        ctx.beginPath();
        ctx.moveTo(pts[0], pts[1]);
        for (var i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
        if (fill) { ctx.closePath(); ctx.fillStyle = css(fill); ctx.fill(); }
        else if (stroke) { ctx.strokeStyle = css(stroke); ctx.lineWidth = width || 1; ctx.lineJoin = 'round'; ctx.stroke(); }
      },
      dot: function (x, y, r, fill, stroke) {
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = css(fill); ctx.fill();
        ctx.strokeStyle = css(stroke); ctx.lineWidth = 1.6; ctx.stroke();
      },
      line: function (x0, y0, x1, y1, colour, width) {
        ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
        ctx.strokeStyle = css(colour); ctx.lineWidth = width || 1; ctx.lineCap = 'round'; ctx.stroke();
      }
    };
    var draw = function () {
      for (var id in tied) values[id] = tied[id].value;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      ctx.clearRect(0, 0, w, h);
      PPGraphs.render(item.kind, g, values, w, h, palette, ranges, hot);
    };
    var at = function (e) {
      var box = canvas.getBoundingClientRect();
      return [(e.clientX - box.left) * (w / box.width), (e.clientY - box.top) * (h / box.height)];
    };
    var each = function (type) { for (var id in tied) send({ type: type, index: tied[id].index }); };
    var move = function (e) {
      if (!hot) return;
      var p = at(e), next = PPGraphs.drag(item.kind, hot, p[0], p[1], values, w, h, ranges);
      for (var id in next) if (tied[id]) tied[id].set(next[id]);
      draw();
    };
    canvas.addEventListener('pointerdown', function (e) {
      if (e.button !== 0) return;
      var p = at(e);
      for (var id in tied) values[id] = tied[id].value;
      hot = PPGraphs.pick(item.kind, p[0], p[1], values, w, h, ranges);
      if (!hot) return;
      canvas.setPointerCapture(e.pointerId);
      for (id in tied) tied[id].held = true;
      each('begin');   // one gesture for the host to record, on every dial the picture can turn
      e.preventDefault();
      move(e);
    });
    canvas.addEventListener('pointermove', move);
    var release = function (e) {
      if (!hot) return;
      hot = null;
      for (var id in tied) tied[id].held = false;
      if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
      each('end');
      draw();
    };
    canvas.addEventListener('pointerup', release);
    canvas.addEventListener('pointercancel', release);
    pictures.push(draw);
    draw();
    return root;
  }

  // The preset menu. `latest` is where every dial is, so the menu can tell whether the
  // chosen preset has been changed since.
  var BAR = 26;
  var presets = [], chosen = -1, latest = [];
  var bar = document.getElementById('bar'), pick = document.getElementById('pick');
  function near(a, b) { return Math.abs(a - b) <= 1e-6 * Math.max(1, Math.abs(b)); }
  function edited() {
    var p = presets[chosen];
    if (!p) return true;
    for (var i = 0; i < p.values.length && i < latest.length; i++) if (!near(latest[i], p.values[i])) return true;
    return false;
  }
  function showChosen() {
    if (!presets.length) return;
    var first = pick.options[0];
    var changed = edited();
    first.hidden = !changed;
    first.textContent = chosen >= 0 ? presets[chosen].name + ' (edited)' : 'No preset';
    pick.value = changed ? 'none' : String(chosen);
  }
  function step(by) {
    if (!presets.length) return;
    var at = chosen < 0 ? (by > 0 ? -1 : 0) : chosen;
    send({ type: 'preset', index: ((at + by) % presets.length + presets.length) % presets.length });
  }
  window.ppPresets = function (list) {
    presets = list || [];
    pick.replaceChildren();
    var none = document.createElement('option');
    none.value = 'none';
    none.disabled = true;
    pick.appendChild(none);
    presets.forEach(function (p, i) {
      var o = document.createElement('option');
      o.value = String(i);
      o.textContent = p.name;
      pick.appendChild(o);
    });
    bar.hidden = !presets.length;
    showChosen();
  };
  window.ppChosen = function (index) { chosen = index; showChosen(); };
  pick.addEventListener('change', function () { if (pick.value !== 'none') send({ type: 'preset', index: Number(pick.value) }); });
  document.getElementById('prev').addEventListener('click', function () { step(-1); });
  document.getElementById('next').addEventListener('click', function () { step(1); });

  var zoom = 1;
  function fit(face) {
    var top = presets.length ? BAR : 0;
    zoom = Math.min(window.innerWidth / face.width, window.innerHeight / (face.height + top)) || 1;
    var root = document.getElementById('root');
    root.style.width = face.width + 'px';
    root.style.height = (face.height + top) + 'px';
    root.style.transform = 'scale(' + zoom + ')';
    // A window the host would not resize for a narrower program: the device in its middle.
    root.style.left = Math.max(0, (window.innerWidth - face.width * zoom) / 2) + 'px';
    document.getElementById('device').style.top = top + 'px';
  }

  // The face, from the plugin. Everything is placed where the patch put it.
  window.ppFace = function (face, map) {
    if (map) {
      face = JSON.parse(JSON.stringify(face));
      face.items.forEach(function (item) {
        if (item.type === 'dial') item.index = map[item.index];
        if (item.type === 'graph') item.dials.forEach(function (d) { d.index = map[d.index]; });
      });
    }
    var host = document.getElementById('device');
    host.replaceChildren();
    dials = [];
    pictures = [];
    document.body.style.background = colour(face.background, '#feddd4');
    var ink = face.items.filter(function (i) { return i.type === 'label'; })[0];
    bar.style.color = colour(ink && ink.color, '#2f1007');
    host.style.width = face.width + 'px';
    host.style.height = face.height + 'px';
    face.items.forEach(function (item) {
      var el;
      if (item.type === 'panel') {
        el = document.createElement('div');
        el.className = 'panel';
        el.style.background = colour(item.color, 'transparent');
        el.style.borderRadius = (item.radius || 0) + 'px';
      } else if (item.type === 'label') {
        el = document.createElement('div');
        el.className = 'label';
        el.textContent = item.text;
        el.style.fontSize = item.size + 'px';
        el.style.color = colour(item.color, '#2f1007');
        el.style.textAlign = item.center ? 'center' : 'left';
        el.style.lineHeight = item.rect[3] + 'px';
      } else if (item.type === 'dial') {
        el = dial(item);
      } else if (item.type === 'graph') {
        el = graph(item);   // after its dials: face() lists the pictures last
      } else {
        return;
      }
      el.style.left = item.rect[0] + 'px';
      el.style.top = item.rect[1] + 'px';
      el.style.width = item.rect[2] + 'px';
      el.style.height = item.rect[3] + 'px';
      host.appendChild(el);
    });
    fit(face);
    window.onresize = function () { fit(face); };
  };

  // Where the host has the dials now. A dial being dragged here is left alone.
  window.ppValues = function (values) {
    latest = values.slice();
    showChosen();
    for (var i = 0; i < values.length; i++) {
      var d = dials[i];
      if (!d || d.held || d.value === values[i]) continue;
      d.value = values[i];
      d.redraw();
    }
    pictures.forEach(function (draw) { draw(); });
  };

  // Ask for the face once both weights of the font are in, so that the names on the cards
  // do not appear a moment after everything else. If that takes too long, go without.
  var asked = false;
  function ready() { if (!asked) { asked = true; send({ type: 'ready' }); } }
  try {
    Promise.all([document.fonts.load('500 10px "DM Mono"'), document.fonts.load('400 10px "DM Mono"')]).then(ready, ready);
  } catch (e) { ready(); }
  setTimeout(ready, 600);
})();
</script>
</body>
</html>
