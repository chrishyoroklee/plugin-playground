# Builds the native side on Linux, macOS and Windows, and holds it to the rules hosts check.
#
#   - the Python tests: the generator, the patch compiler, the C++ it writes, and the
#     runtime against that C++, sample for sample, for every preset
#   - the runtime plugin (CLAP, VST3 and, on macOS, Audio Unit) and the helper, wrapped
#     in this system's installer; then every preset made into a plugin by the helper,
#     loaded, and compared with the device it was made from (hostcheck)
#   - the installer run as a visitor would run it, a device opened with what it
#     installed, and the result put through clap-validator, pluginval and auval
#   - one preset compiled into a plugin of its own, the way `npm run plugin` does
#
# The installer is kept as the run's artifact. pages.yml calls this workflow and
# publishes the three of them with the site, as the page's downloads.
name: Native plugins

on:
  push:
    branches-ignore: [main]   # on main, pages.yml runs this as part of the deploy
    paths:
      - native/**
      - src/plugin/**
      - src/objects/**
      - scripts/plugin.*
      - scripts/maxcheck/**
      - tests/**
      - .github/workflows/native.yml
  pull_request:
    paths:
      - native/**
      - src/plugin/**
      - src/objects/**
      - scripts/plugin.*
      - scripts/maxcheck/**
      - tests/**
      - .github/workflows/native.yml
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The wheel the page itself loads. PyPI's 0.1.1 is an older build that lacks objects
      # the generator uses.
      - run: python -m pip install public/py/maxpylang-*.whl pytest numpy

      # The generator, the compiler, and the C++ it writes against the browser engine's rendering.
      - run: python -m pytest tests -q

      # The Windows installer is made with Inno Setup.
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: |
          if [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then choco install innosetup -y --no-progress; fi

      # The runtime and the helper, in this system's installer: a .pkg, a setup .exe, or
      # a .tar.gz with an install script. Then every preset as the helper makes it,
      # each loaded and held to its device, and every plugin of the page with its presets
      # in one file, each preset loaded in turn.
      - name: Build the runtime and make every preset and plugin from it
        run: python scripts/plugin.py --runtime --all --plugins --package downloads

      - uses: actions/upload-artifact@v4
        with:
          name: downloads-${{ matrix.os }}
          path: |
            downloads/*.pkg
            downloads/*.exe
            downloads/*.tar.gz
          if-no-files-found: error

      - name: Install the validators
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          cargo install --git https://github.com/free-audio/clap-validator --root "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
          case "$RUNNER_OS" in
            Linux)   zip=pluginval_Linux.zip;   bin=. ;;
            macOS)   zip=pluginval_macOS.zip;   bin=pluginval.app/Contents/MacOS ;;
            Windows) zip=pluginval_Windows.zip; bin=. ;;
          esac
          curl -sSL -o "$RUNNER_TEMP/pluginval.zip" "https://github.com/Tracktion/pluginval/releases/latest/download/$zip"
          (cd "$RUNNER_TEMP/tools" && unzip -q "$RUNNER_TEMP/pluginval.zip")
          echo "$RUNNER_TEMP/tools/$bin" >> "$GITHUB_PATH"
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -q && sudo apt-get install -y -q xvfb; fi

      # What a visitor does: run the installer, then open a device file. A feedback delay
      # through two lines, a chain of three effects, and an instrument are each opened
      # with what the installer put on the machine, have to land where hosts scan, and
      # are then put through the validators. On macOS that includes auval, which an Audio
      # Unit has to pass before Logic lists it.
      - name: Run the installer, open three devices, validate them
        run: |
          run=""
          if [ "$RUNNER_OS" = Linux ]; then run="xvfb-run -a"; fi
          $run python scripts/plugin.py --runtime --preset pingpong --package downloads --check-installer downloads --validate
          $run python scripts/plugin.py --runtime --preset "Tape Lo-Fi" --check-installer downloads --validate
          $run python scripts/plugin.py --runtime --preset "Soft Pad" --check-installer downloads --validate

      # The other way to a plugin, for someone with a compiler: one device, compiled.
      - name: Compile one preset into a plugin of its own
        run: python scripts/plugin.py --preset pingpong
