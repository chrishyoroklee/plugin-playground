# Builds native plugins from the generator's patches on Linux, macOS and Windows, and
# holds them to the rules their hosts check: the patch compiler's tests, then two presets
# built as CLAP, VST3 and (on macOS) Audio Unit, each loaded by hostcheck, clap-validator,
# pluginval and auval. The plugins are kept as artifacts of the run.
name: Native plugins

on:
  push:
    paths:
      - native/**
      - src/plugin/**
      - scripts/plugin.*
      - scripts/maxcheck/**
      - tests/**
      - .github/workflows/native.yml
  pull_request:
    paths:
      - native/**
      - src/plugin/**
      - scripts/plugin.*
      - scripts/maxcheck/**
      - tests/**
      - .github/workflows/native.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The wheel the page itself loads. PyPI's 0.1.1 is an older build that lacks objects
      # the generator uses.
      - run: python -m pip install public/py/maxpylang-*.whl pytest numpy

      # The generator, the compiler, and the C++ it writes against the browser engine's rendering.
      - run: python -m pytest tests -q

      - name: Install the validators
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          cargo install --git https://github.com/free-audio/clap-validator --root "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
          case "$RUNNER_OS" in
            Linux)   zip=pluginval_Linux.zip;   bin=. ;;
            macOS)   zip=pluginval_macOS.zip;   bin=pluginval.app/Contents/MacOS ;;
            Windows) zip=pluginval_Windows.zip; bin=. ;;
          esac
          curl -sSL -o "$RUNNER_TEMP/pluginval.zip" "https://github.com/Tracktion/pluginval/releases/latest/download/$zip"
          (cd "$RUNNER_TEMP/tools" && unzip -q "$RUNNER_TEMP/pluginval.zip")
          echo "$RUNNER_TEMP/tools/$bin" >> "$GITHUB_PATH"
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -q && sudo apt-get install -y -q xvfb; fi

      # A feedback delay through two lines, and a chain of three modules.
      - name: Build, install and validate two presets
        run: |
          run=""
          if [ "$RUNNER_OS" = Linux ]; then run="xvfb-run -a"; fi
          $run python scripts/plugin.py --preset pingpong --install --validate
          $run python scripts/plugin.py --preset "Tape Lo-Fi" --install --validate

      - uses: actions/upload-artifact@v4
        with:
          name: plugins-${{ matrix.os }}
          path: |
            build/plugins/*/*.clap
            build/plugins/*/*.vst3
            build/plugins/*/*.component
            build/plugins/*/Effect.h
          if-no-files-found: error
