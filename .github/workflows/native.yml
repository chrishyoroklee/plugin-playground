# Builds native plugins from the generator's patches on Linux, macOS and Windows, and
# holds them to the rules their hosts check.
#
#   - the Python tests: the generator, the patch compiler, and the C++ it writes
#   - every preset, effects and instruments, built as CLAP, VST3 and (on macOS) Audio
#     Unit; each build loads its own .clap and compares it with the C++ (hostcheck)
#   - two installers run as a visitor would run them, and what they installed checked
#   - three presets installed and put through clap-validator, pluginval and auval
#
# Each build is wrapped in its system's installer and kept as the run's artifacts.
# pages.yml calls this workflow and publishes those installers with the site, as the
# page's downloads.
name: Native plugins

on:
  push:
    branches-ignore: [main]   # on main, pages.yml runs this as part of the deploy
    paths:
      - native/**
      - src/plugin/**
      - src/objects/**
      - scripts/plugin.*
      - scripts/maxcheck/**
      - tests/**
      - .github/workflows/native.yml
  pull_request:
    paths:
      - native/**
      - src/plugin/**
      - src/objects/**
      - scripts/plugin.*
      - scripts/maxcheck/**
      - tests/**
      - .github/workflows/native.yml
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The wheel the page itself loads. PyPI's 0.1.1 is an older build that lacks objects
      # the generator uses.
      - run: python -m pip install public/py/maxpylang-*.whl pytest numpy

      # The generator, the compiler, and the C++ it writes against the browser engine's rendering.
      - run: python -m pytest tests -q

      # The Windows installer is made with Inno Setup.
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: |
          if [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then choco install innosetup -y --no-progress; fi

      # Every preset, each checked against its Effect.h as it is built, then wrapped in
      # this system's installer: a .pkg, a setup .exe, or a .tar.gz with an install script.
      - name: Build every preset
        run: python scripts/plugin.py --all --package downloads

      - uses: actions/upload-artifact@v4
        with:
          name: downloads-${{ matrix.os }}
          path: |
            downloads/*.pkg
            downloads/*.exe
            downloads/*.tar.gz
          if-no-files-found: error

      # What a visitor does: run the installer, then open a host. An effect and an
      # instrument are installed for the whole machine and have to land where hosts scan;
      # on macOS each Audio Unit then has to pass auval, as it must before Logic lists it.
      - name: Run two of the installers
        run: |
          python scripts/plugin.py --preset pingpong --package downloads --check-installer downloads
          python scripts/plugin.py --preset "Soft Pad" --package downloads --check-installer downloads

      - name: Install the validators
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          cargo install --git https://github.com/free-audio/clap-validator --root "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
          case "$RUNNER_OS" in
            Linux)   zip=pluginval_Linux.zip;   bin=. ;;
            macOS)   zip=pluginval_macOS.zip;   bin=pluginval.app/Contents/MacOS ;;
            Windows) zip=pluginval_Windows.zip; bin=. ;;
          esac
          curl -sSL -o "$RUNNER_TEMP/pluginval.zip" "https://github.com/Tracktion/pluginval/releases/latest/download/$zip"
          (cd "$RUNNER_TEMP/tools" && unzip -q "$RUNNER_TEMP/pluginval.zip")
          echo "$RUNNER_TEMP/tools/$bin" >> "$GITHUB_PATH"
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -q && sudo apt-get install -y -q xvfb; fi

      # A feedback delay through two lines, a chain of three effects, and an instrument.
      - name: Install and validate three presets
        run: |
          run=""
          if [ "$RUNNER_OS" = Linux ]; then run="xvfb-run -a"; fi
          $run python scripts/plugin.py --preset pingpong --install --validate
          $run python scripts/plugin.py --preset "Tape Lo-Fi" --install --validate
          $run python scripts/plugin.py --preset "Soft Pad" --install --validate
